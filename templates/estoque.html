<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUCHIKO - Gestão de Estoque</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #55b3b1;
            --primary-hover: #449795;
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-color: #385e5d;
            --border-color: #cce3e1;
            --danger-color: #f28b82;
            --danger-hover: #d96b62;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Segoe UI', cursive, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header p {
            color: #7ca8a6;
            font-size: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(85, 179, 177, 0.08);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 16px;
            color: var(--primary-color);
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        input {
            padding: 10px 14px;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.95rem;
            outline: none;
            color: var(--text-color);
            background-color: #fafdfd;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
            background-color: #fff;
        }

        .btn-container {
            margin-top: 16px;
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 14px;
        }

        .btn-danger {
            background-color: var(--danger-color);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f2f9f9;
            color: var(--primary-color);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td input[type="number"] {
            width: 70px;
            padding: 4px 8px;
            text-align: center;
        }

        .actions-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MUCHIIKO 🍓</h1>
        <p>Gestão de Estoque e Produtos</p>
    </header>

    <!-- Formulário Cadastrar Produto -->
    <div class="card">
        <h2 class="card-title">✨ Cadastrar Novo Produto</h2>
        <form action="/cadastrar-produto" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Chocolate Nestlé" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" name="categoria" placeholder="Ex: Doces" required>
                </div>
                <div class="form-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="qtd">Quantidade Inicial</label>
                    <input type="number" id="qtd" name="qtd" min="0" placeholder="0" required>
                </div>
            </div>
            <div class="btn-container">
                <button type="submit" class="btn">Cadastrar Produto</button>
            </div>
        </form>
    </div>

    <!-- Tabela de Produtos -->
    <div class="card">
        <h2 class="card-title">📦 Itens em Estoque</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for index, produto in produtos %}
                    <tr>
                        <td>{{ produto.nome }}</td>
                        <td>{{ produto.categoria }}</td>
                        <td>R$ {{ "%.2f"|format(produto.preco) }}</td>
                        <td>
                            <form action="/alterar-estoque" method="POST" id="form-alterar-{{ index }}" style="display: inline-flex;">
                                <input type="hidden" name="index" value="{{ index }}">
                                <input type="number" name="qtd" value="{{ produto.quantidade }}" min="0" required>
                            </form>
                        </td>
                        <td class="actions-cell">
                            <button type="submit" form="form-alterar-{{ index }}" class="btn btn-sm">Alterar</button>
                            <form action="/remover-produto" method="POST" style="display: inline;">
                                <input type="hidden" name="index" value="{{ index }}">
                                <button type="submit" class="btn btn-sm btn-danger">Remover</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
