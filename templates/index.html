<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Muchiiko - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Knewave&family=Playfair+Display+SC:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        #cabecalho {
            background-color: #89CAD9;
            padding: 20px 0;
            position: relative;
        }

        h1 {
            font-family: 'Knewave', sans-serif;
            color: aliceblue;
            text-align: center;
            font-size: 100px;
            margin: 0;
        }

        .icone-banner {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-40%);
            height: 220px;
            width: auto;
            z-index: 10;
        }

        .login_box {
            width: 590px;
            background: #fffef8;
            border: 4px solid #89CAD9;
            border-radius: 25px;
            padding: 35px 45px;
            text-align: center;
            box-shadow: 10px 10px 0px #89CAD9;
            margin: 40px auto;
            box-sizing: border-box;
        }

        .icone-banner-box {
            width: 250px;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 8px;
            font-family: 'Playpen Sans', sans-serif;
            color: #3a8c9e;
        }

        .login_box > p {
            margin-bottom: 25px;
            font-size: 17px;
            font-family: 'Playpen Sans', sans-serif;
            color: #3a8c9e;
        }

        .input-container {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }

        .input-container input {
            width: 100%;
            padding: 15px 20px 15px 45px;
            font-family: 'Playpen Sans', sans-serif;
            font-size: 16px;
            border: 2px solid #89CAD9;
            border-radius: 12px;
            outline: none;
            box-sizing: border-box;
            color: #555;
            background-color: #fff;
        }

        .input-container .input-senha {
            padding-right: 45px;
        }

        .input-container .img-icone {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 40px;
            width: auto;
        }

        .input-container .icone-principal {
            pointer-events: none;
        }

        .input-container .icone-olho {
            right: 18px;
            cursor: pointer;
        }

        .lembrar-esqueceu-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-family: 'Playpen Sans', sans-serif;
            font-size: 14px;
        }

        .lembrar-mim {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #65a1b0;
            cursor: pointer;
        }

        .lembrar-mim input[type="checkbox"] {
            cursor: pointer;
            accent-color: #61b3b8;
        }

        .esqueceu-senha {
            color: #3a8c9e;
            text-decoration: underline;
        }

        .esqueceu-senha:hover {
            color: #275f6c;
        }

        .btn-enviar {
            width: 100%;
            background-color: #61b3b8;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 15px 0;
            font-family: 'Playpen Sans', sans-serif;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-enviar:hover {
            background-color: #4da1a6;
        }

        .btn-enviar .seta {
            font-size: 20px;
        }

        .mensagem {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Playpen Sans', sans-serif;
            font-weight: bold;
        }

        .sucesso {
            color: #26734d;
            background-color: #d9f5e5;
            border: 2px solid #7ac99b;
        }

        .erro {
            color: #a33a3a;
            background-color: #ffe0e0;
            border: 2px solid #e28a8a;
        }

    </style>
</head>

<body>

    <div id="cabecalho">
        <h1>MUCHIIKO</h1>

        <img
            src="{{ url_for('static', filename='icon.png') }}"
            alt="Gatinho"
            class="icone-banner"
        >
    </div>


    <div class="login_box">

        <img
            src="{{ url_for('static', filename='download.png') }}"
            alt="Gatinho2"
            class="icone-banner-box"
        >

        <h2>Bem-vindo admin!</h2>

        <p>Faça login para continuar</p>


        {% if mensagem %}

            <div class="mensagem {% if sucesso %}sucesso{% else %}erro{% endif %}">
                {{ mensagem }}
            </div>

        {% endif %}


        <form method="POST" action="{{ url_for('home') }}">

            <div class="input-container">

                <img
                    src="{{ url_for('static', filename='canvas.png') }}"
                    alt="Usuário"
                    class="img-icone icone-principal"
                >

                <input
                    type="text"
                    name="usuario"
                    placeholder="Nome de usuário"
                    required
                >

            </div>


            <div class="input-container">

                <img
                    src="{{ url_for('static', filename='EMAIL.png') }}"
                    alt="Email"
                    class="img-icone icone-principal"
                >

                <input
                    type="email"
                    name="email"
                    placeholder="E-mail"
                    required
                >

            </div>


            <div class="input-container">

                <img
                    src="{{ url_for('static', filename='adeados.png') }}"
                    alt="Senha"
                    class="img-icone icone-principal"
                >

                <input
                    type="password"
                    name="senha"
                    class="input-senha"
                    placeholder="Senha"
                    required
                >

                <img
                    src="{{ url_for('static', filename='olhu.png') }}"
                    alt="Ver senha"
                    class="img-icone icone-olho"
                    onclick="mostrarSenha()"
                >

            </div>


            <div class="input-container">

                <img
                    src="{{ url_for('static', filename='ID.png') }}"
                    alt="ID"
                    class="img-icone icone-principal"
                >

                <input
                    type="number"
                    name="id"
                    placeholder="ID do usuário"
                    required
                >

            </div>


            <div class="lembrar-esqueceu-container">

                <label class="lembrar-mim">

                    <input
                        type="checkbox"
                        name="lembrar"
                    >

                    <span>Lembrar de mim</span>

                </label>


                <a href="#" class="esqueceu-senha">
                    Esqueceu sua senha?
                </a>

            </div>


            <button type="submit" class="btn-enviar">

                Entrar
                <span class="seta">→</span>

            </button>

        </form>

    </div>


    <script>

        function mostrarSenha() {

            const senha = document.querySelector(".input-senha");

            if (senha.type === "password") {
                senha.type = "text";
            } else {
                senha.type = "password";
            }

        }

    </script>

</body>

</html>
